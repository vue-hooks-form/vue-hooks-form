name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          # Lockfiles are still v6. pnpm 10+ ignores them and pnpm 12 rejects them.
          version: 9.15.9

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Install
        run: pnpm install

      - name: Core Build
        run: pnpm run build:core

      - name: class-validator Build
        run: pnpm run build:class-validator

      - name: Yup Build
        run: pnpm run build:yup

      - name: Test
        run: pnpm run test
